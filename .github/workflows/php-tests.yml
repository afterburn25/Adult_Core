name: PHP checks
on:
  push:
  pull_request:
# Supersede stale runs within each trigger, but never let push and PR
# checks cancel or starve one another (they have different review purposes).
concurrency:
  group: php-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootsecret
          MYSQL_DATABASE: adultcore_ci
          MYSQL_USER: adultcore
          MYSQL_PASSWORD: adultcorepass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, fileinfo, phar, zip
          coverage: none
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do php -l "$f"; done < <(find src install public tests scripts -type f -name '*.php' -print0)
      - name: Unit and installation-gate tests
        run: php tests/run.php
      - name: Signed module and theme package tests
        run: php tests/package_tests.php
      - name: Advanced foundations (themes, billing inbox, Pro jobs)
        run: php tests/advanced_tests.php
      - name: One-package source ZIP integrity and private-secret exclusion
        run: php tests/release_distribution_tests.php
      - name: Independently signed source ZIP verification and malicious-archive rejection
        run: php tests/signed_source_release_tests.php
      - name: Offline signed-source update preview, symlink denial and no-write test
        run: php tests/signed_source_update_preview_tests.php
      - name: Private signed source staging with no live-site writes
        run: php tests/private_source_stage_tests.php
      - name: Independently verify complete private source stage and reject tampering
        run: php tests/private_source_stage_verifier_tests.php
      - name: Signed runtime transition, rollback material and independent runtime stage integrity
        run: php tests/signed_runtime_preflight_tests.php
      - name: All ten release workstreams and fail-closed JSON readiness status
        run: php tests/release_matrix_tests.php
      - name: Pro envelope and release-gate tests
        run: php tests/pro_release_tests.php
      - name: Lite shared-host / Pro VPS deployment preflight safety tests
        run: php tests/deployment_preflight_tests.php
      - name: Token-authenticated Pro agent and deployment CLI contract
        run: python3 tests/deployment_agent_contract.py
      - name: Staging-host HTTPS safety and live PHP preinstall protocol checks (offline)
        run: python3 tests/staging_host_audit_tests.py
      - name: Disposable real Apache rewrite and private-script denial smoke
        run: python3 tests/apache_preinstall_smoke.py
      - name: Public page and member-session tests
        run: php tests/site_member_tests.php
      - name: Moderation input validation
        run: php tests/moderation_tests.php
      - name: Membership tier label boundaries
        run: php tests/tier_catalog_tests.php
      - name: Staff lifecycle policy and validation
        run: php tests/staff_tests.php
      - name: Self-hosted local creator permissions and draft input boundaries
        run: php tests/local_creator_tests.php
      - name: Private creator text review safety boundaries
        run: php tests/creator_review_tests.php
      - name: Local creator private feedback history safety boundaries
        run: php tests/creator_feedback_tests.php
      - name: Member-scoped read-only subscription summary
        run: php tests/member_subscription_summary_tests.php
      - name: Private image metadata and malformed-container rejection
        run: php tests/image_metadata_tests.php
      - name: Signed verification assertions and replay protection
        run: php tests/verification_tests.php
      - name: Release manifest and encrypted snapshot authentication
        run: php tests/release_security_tests.php
      - name: Encrypted portable recovery integrity and unsafe-path tests
        run: php tests/backup_tests.php
      - name: Private archive verification, vault rotation and maintenance gating
        run: php tests/backup_vault_tests.php
      - name: Shared UI design system and escaping tests
        run: php tests/ui_tests.php
      - name: Visual Design Studio safety tests
        run: php tests/design_tests.php
      - name: Administrator MFA TOTP, recovery and session security tests
        run: php tests/mfa_tests.php
      - name: Cajun Web Pro licensing contract and gate tests
        run: php tests/licensing_tests.php
      - name: Interrupted license update signed rollback and CLI recovery
        run: php tests/license_update_recovery_tests.php
      - name: Lite-to-Pro edition upgrade safety checks
        run: php tests/upgrade_tests.php
      - name: Loopback HTTP subscription activation and issuer lifecycle contract
        run: python3 tests/cwp_subscription_contract.py
      - name: Opt-in Cajun Web Pro staging probe security tests (offline)
        run: php tests/cwp_staging_audit_tests.php
      - name: Direct HTTP installer service hostname/issuer boundary
        run: python3 tests/installer_service_http.py
      - name: HTTP lifecycle smoke tests
        run: python3 tests/http_smoke.py
      - name: Private media orphan, missing-file and symlink audit (disposable MySQL)
        run: php tests/mysql_private_media_audit.php
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass

      - name: Verified payment inbox idempotency and conflicting replay (disposable MySQL)
        run: php tests/mysql_billing_inbox.php
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass

      - name: Real MySQL installation integration test (disposable CI database)
        run: php tests/mysql_install.php
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass

      - name: Real HTTP administrator login/logout integration test (disposable CI database)
        run: python3 tests/mysql_http_auth.py
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass

      - name: Full encrypted backup and fresh-database restore (disposable CI database)
        run: php tests/mysql_backup_restore.php
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass

  mariadb_compat:
    name: MariaDB 10.11 shared-host SQL compatibility (disposable)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootsecret
          MARIADB_DATABASE: adultcore_ci
          MARIADB_USER: adultcore
          MARIADB_PASSWORD: adultcorepass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, fileinfo, phar, zip
          coverage: none
      - name: MariaDB private-media and billing replay (disposable)
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_PORT: '3307'
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass
        run: |
          set -euo pipefail
          php tests/mysql_private_media_audit.php
          php tests/mysql_billing_inbox.php
      - name: MariaDB fresh Lite install, authenticated HTTP and encrypted recovery
        env:
          AC_TEST_DB_CONFIRM: YES_THIS_IS_A_DISPOSABLE_DATABASE
          AC_TEST_DB_HOST: 127.0.0.1
          AC_TEST_DB_PORT: '3307'
          AC_TEST_DB_NAME: adultcore_ci
          AC_TEST_DB_USER: adultcore
          AC_TEST_DB_PASSWORD: adultcorepass
        run: |
          set -euo pipefail
          php tests/mysql_install.php
          python3 tests/mysql_http_auth.py
          php tests/mysql_backup_restore.php
